name: Android Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - driver
          - passenger
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
  push:
    tags:
      - 'driver-v*'
      - 'passenger-v*'
      - 'v*'

permissions:
  contents: read

jobs:
  build-driver:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'driver' || github.event.inputs.app == 'both')
      || github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/driver-v') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver-app/android
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: corepack pnpm install
        env:
          CI: 'true'

      - name: Build workspace libs
        run: cd ../.. && npx nx run-many -t build -p @higo/brand-tokens,@higo/shared-types,@higo/api-client

      - name: Ensure notification ring sound is in Android raw resources
        run: |
          mkdir -p app/src/main/res/raw
          cp ../../src/assets/ring.mp3 app/src/main/res/raw/ring.mp3

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        run: chmod +x gradlew && ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_APP_URL: https://pilot.hiconnectgo.com
          EXPO_PUBLIC_API_BASE_URL: https://api.hiconnectgo.com/api
          EXPO_PUBLIC_SOCKET_URL: https://api.hiconnectgo.com
          EXPO_PUBLIC_MAPS_MOCK: 'false'
          EXPO_PUBLIC_PUSH_MOCK: 'false'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build AAB
        if: ${{ github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/') }}
        run: chmod +x gradlew && ./gradlew bundleRelease
        env:
          EXPO_PUBLIC_APP_URL: https://pilot.hiconnectgo.com
          EXPO_PUBLIC_API_BASE_URL: https://api.hiconnectgo.com/api
          EXPO_PUBLIC_SOCKET_URL: https://api.hiconnectgo.com
          EXPO_PUBLIC_MAPS_MOCK: 'false'
          EXPO_PUBLIC_PUSH_MOCK: 'false'
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Re-sign AAB with upload key
        if: ${{ github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > /tmp/upload-keystore.jks
          AAB_PATH=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          # Remove existing signature
          zip -d "$AAB_PATH" "META-INF/*" || true
          # Re-sign with upload key
          jarsigner -keystore /tmp/upload-keystore.jks \
            -storepass "$UPLOAD_KEYSTORE_PASSWORD" \
            -keypass "$UPLOAD_KEYSTORE_PASSWORD" \
            "$AAB_PATH" upload
          # Verify
          jarsigner -verify "$AAB_PATH"
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}

      - name: Upload APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: higo-driver-apk
          path: apps/driver-app/android/app/build/outputs/apk/release/

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: higo-driver-aab
          path: apps/driver-app/android/app/build/outputs/bundle/release/

  build-passenger:
    if: >-
      github.event_name == 'workflow_dispatch' && (github.event.inputs.app == 'passenger' || github.event.inputs.app == 'both')
      || github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/passenger-v') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/passenger-app/android
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: corepack pnpm install
        env:
          CI: 'true'

      - name: Build workspace libs
        run: cd ../.. && npx nx run-many -t build -p @higo/brand-tokens,@higo/shared-types,@higo/api-client

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        run: chmod +x gradlew && ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_APP_URL: https://ride.hiconnectgo.com
          EXPO_PUBLIC_API_BASE_URL: https://api.hiconnectgo.com/api
          EXPO_PUBLIC_SOCKET_URL: https://api.hiconnectgo.com
          EXPO_PUBLIC_MAPS_MOCK: 'false'
          EXPO_PUBLIC_PUSH_MOCK: 'false'
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build AAB
        if: ${{ github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/') }}
        run: chmod +x gradlew && ./gradlew bundleRelease
        env:
          EXPO_PUBLIC_APP_URL: https://ride.hiconnectgo.com
          EXPO_PUBLIC_API_BASE_URL: https://api.hiconnectgo.com/api
          EXPO_PUBLIC_SOCKET_URL: https://api.hiconnectgo.com
          EXPO_PUBLIC_MAPS_MOCK: 'false'
          EXPO_PUBLIC_PUSH_MOCK: 'false'
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Re-sign AAB with upload key
        if: ${{ github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > /tmp/upload-keystore.jks
          AAB_PATH=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          zip -d "$AAB_PATH" "META-INF/*" || true
          jarsigner -keystore /tmp/upload-keystore.jks \
            -storepass "$UPLOAD_KEYSTORE_PASSWORD" \
            -keypass "$UPLOAD_KEYSTORE_PASSWORD" \
            "$AAB_PATH" upload
          jarsigner -verify "$AAB_PATH"
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}

      - name: Upload APK
        if: ${{ github.event.inputs.build_type != 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: higo-passenger-apk
          path: apps/passenger-app/android/app/build/outputs/apk/release/

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'aab' || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: higo-passenger-aab
          path: apps/passenger-app/android/app/build/outputs/bundle/release/
